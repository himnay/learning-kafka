name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The parent chain (super-pom -> learning-bom) is not published to Maven Central,
      # so check both out and install them into the runner's local repository first.
      - uses: actions/checkout@v4
        with:
          repository: himnay/learning-bom
          path: learning-bom
      - uses: actions/checkout@v4
        with:
          repository: himnay/super-pom
          path: super-pom
      - uses: actions/checkout@v4
        with:
          path: learning-kafka
      - uses: actions/setup-java@v4
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: maven
      - name: Install learning-bom
        run: mvn -B -N install
        working-directory: learning-bom
      - name: Install super-pom
        run: mvn -B -N install
        working-directory: super-pom
      - name: Validate Docker Compose files
        # the root compose include:s kafka-core/docker-compose.yml — check both resolve
        run: |
          docker compose config -q
          docker compose -f kafka-core/docker-compose.yml config -q
        working-directory: learning-kafka
      - name: Build and test
        # Testcontainers (PostgreSQL, cp-kafka) needs Docker — available on GitHub's Ubuntu runners
        run: mvn -B verify
        working-directory: learning-kafka

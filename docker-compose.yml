# Full local stack = the kafka-core stack + observability.
#
# kafka-core/docker-compose.yml is the single source of truth for Kafka (3 brokers, KRaft), topic
# setup, Schema Registry, PostgreSQL, Kafka Connect and Kafdrop; this file only adds Prometheus and
# Grafana. Both files use the same Compose project name, so `docker compose up -d` here and in
# kafka-core/ manage the SAME containers and volumes — run either one.
name: kafka-core

include:
  - kafka-core/docker-compose.yml

services:

  # ── Prometheus — scrapes /actuator/prometheus of the apps running on the host ──
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: kafka-core-prometheus
    ports:
      - "9091:9090"
    extra_hosts:
      # Docker Desktop resolves host.docker.internal by itself; plain Linux Docker needs this
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  # ── Grafana — Prometheus datasource + the "Learning Kafka" dashboard, provisioned ──
  grafana:
    image: grafana/grafana:13.2.3
    container_name: kafka-core-grafana
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin          # local demo only
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-storage:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-storage:

spring:
  application:
    name: events-consumer-b
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092          # any broker of the 3-node cluster; clients discover the rest
    # The kafka-core cluster's host listener is SASL_SSL: TLS (truststore holding the dev CA from the
    # kafka-certs compose service) + SCRAM-SHA-512 (user created by kafka-init).
    # Env overrides: KAFKA_USERNAME, KAFKA_PASSWORD, KAFKA_TRUSTSTORE, KAFKA_TRUSTSTORE_PASSWORD.
    security:
      protocol: SASL_SSL
    ssl:
      trust-store-location: file:${KAFKA_TRUSTSTORE:../certs/kafka.truststore.p12}
      trust-store-password: ${KAFKA_TRUSTSTORE_PASSWORD:kafka-dev-secret}
      trust-store-type: PKCS12
    template:
      default-topic: library-events
    properties:
      # Confluent Schema Registry (kafka-core docker compose) — used by both the Avro
      # deserializer (consuming) and the Avro serializer (state topic, retry topic, DLT)
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
      sasl.mechanism: SCRAM-SHA-512
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:events-consumer}" password="${KAFKA_PASSWORD:events-consumer-secret}";
    listener:
      # 1 listener thread per app. Consumer-a and consumer-b share the SAME group-id,
      # so the group coordinator splits the 3 partitions between them (e.g. a: P0,P1  b: P2).
      concurrency: 1
    consumer:
      group-id: library-events-listener-group
      client-id: ${spring.application.name}   # shows which app owns which partition in kafka-consumer-groups
      auto-offset-reset: earliest
      isolation-level: read_committed      # never see records from aborted transactions
      enable-auto-commit: false            # offsets are committed inside the Kafka transaction
      key-deserializer: org.apache.kafka.common.serialization.IntegerDeserializer
      # ErrorHandlingDeserializer wraps the Avro deserializer: a record that is not valid Avro
      # becomes a DeserializationException the error path can dead-letter, instead of a
      # poison pill that fails every poll()
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true         # generated classes (LibraryEventAvro, CoffeeOrder), not GenericRecord
        # KIP-848 "next generation" rebalance protocol (GA in Kafka 4.0, opt-in): the BROKER computes the
        # assignment and rebalances are incremental — no stop-the-world. Only consumer-b opts in, so the
        # groups mix both protocols (consumer-a is "classic"); the broker supports that mix.
        group.protocol: consumer
    producer:
      # A transaction-id-prefix turns on Kafka transactions: Boot creates a
      # KafkaTransactionManager and makes KafkaTemplate transactional.
      # Must be unique per running app instance.
      transaction-id-prefix: ${spring.application.name}-tx-
      acks: all                            # required by idempotence/transactions
      compression-type: zstd               # DLT, state-topic and retry records are compressed too
      key-serializer: org.apache.kafka.common.serialization.IntegerSerializer
      # value serializer: set in code (Avro for records, raw bytes for undeserializable ones)
      properties:
        enable.idempotence: true           # broker de-dups producer retries (PID + sequence)
        max.in.flight.requests.per.connection: 5   # <= 5 keeps ordering with idempotence
  # ── Database ──────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5435}/${POSTGRES_DB:library}
    username: ${POSTGRES_USER:library}
    password: ${POSTGRES_PASSWORD:library}
    hikari:
      # fail fast while PostgreSQL is down (default 30 s): 3 attempts take seconds, then the record
      # moves on to the retry topic instead of stalling the listener past max.poll.interval.ms
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate                   # Flyway owns the schema; Hibernate only checks it
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Kafka consumer (KIP-848 group protocol) — Avro library events into PostgreSQL, plus coffee orders
    version: 0.0.1-SNAPSHOT

app:
  retry:
    # Recoverable failures (RecoverableDataAccessException) wait here instead of being re-published
    topic: library-events.retry
    group-id: library-events-retry-group   # the scheduled drain job's own consumer group
    interval: 30s       # fixed delay between two drain runs
    delay: 30s          # a record is retried only after waiting this long on the retry topic (default: interval)
    max-attempts: 3     # processing attempts from the retry topic before the DLT
    max-run: 1m         # a single drain run never drains longer than this

# Logging: see logback-spring.xml

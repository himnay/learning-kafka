spring:
  application:
    name: events-producer
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092          # any broker of the 3-node cluster; clients discover the rest
    template:
      default-topic: library-events
    producer:
      key-serializer: org.apache.kafka.common.serialization.IntegerSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      # Compression happens here, before anything is sent: records collect in a per-partition
      # batch, the batch is zstd-compressed as one block, and that block crosses the network, is
      # stored as-is by the broker (topic compression.type=producer) and is decompressed by the
      # consumer. Applies to every template built from this factory (library, coffee, key-routing).
      compression-type: zstd
      properties:
        acks: all
        retries: 10
        retry.backoff.ms: 1000
        enable.idempotence: "true"
        # One compressed block per batch, so bigger batches compress better. Wait up to 20 ms
        # (Kafka 4 default: 5) for more records to join; batch.size (16 KB) still caps a batch.
        linger.ms: 20
        # Confluent Schema Registry (kafka-core docker compose). The serializer registers each
        # schema on first send: subjects "library-events-value" and "coffee-orders-value".
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
  # ── Database: coffee orders are stored with their outbox event (schema coffee) ──
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5435}/${POSTGRES_DB:library}
    username: ${POSTGRES_USER:library}
    password: ${POSTGRES_PASSWORD:library}
  flyway:
    # the producer owns its own schema, with its own Flyway history, next to the consumers' tables
    schemas: coffee
    default-schema: coffee

app:
  coffee:
    # CoffeeVipPartitioner sends these customers' orders to partition 0
    vip-customers: Ada,Grace
    # coffee-orders partition count: the VIP rule hashes everyone else over partitions 1..N-1
    partitions: 3
  key-routing:
    # KeySubstringPartitioner: every key containing one of these substrings goes to one partition.
    # "VIP=0" pins VIP to partition 0; a bare substring is hashed (murmur2): UK → 1, US → 2 on 3 partitions.
    substring-partitions: VIP=0,UK,US

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: REST API that publishes Avro library events and coffee orders to Kafka
    version: 0.0.1-SNAPSHOT

# Logging: see logback-spring.xml

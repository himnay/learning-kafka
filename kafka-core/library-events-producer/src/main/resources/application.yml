spring:
  application:
    name: library-events-producer
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092          # any broker of the 3-node cluster; clients discover the rest
    template:
      default-topic: library-events
    producer:
      key-serializer: org.apache.kafka.common.serialization.IntegerSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      # Compress whole batches on the producer. The broker stores them as-is (topic
      # compression.type=producer) and consumers decompress — less network and disk.
      compression-type: zstd
      properties:
        acks: all
        retries: 10
        retry.backoff.ms: 1000
        enable.idempotence: "true"
        # Confluent Schema Registry (kafka-core docker compose). The serializer registers each
        # schema on first send: subjects "library-events-value" and "coffee-orders-value".
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}

app:
  coffee:
    # CoffeeVipPartitioner sends these customers' orders to partition 0
    vip-customers: Ada,Grace

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: REST API that publishes Avro library events and coffee orders to Kafka
    version: 0.0.1-SNAPSHOT

# Logging: see logback-spring.xml

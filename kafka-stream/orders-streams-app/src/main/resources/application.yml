spring:
  application:
    name: orders-kafka-streams
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  kafka:
    streams:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}   # any broker of the kafka-core cluster
      application-id: orders-kafka-streams
      # state-dir: /var/lib/orders-streams                           # RocksDB state (default: <tmp>/kafka-streams)
# Serdes and exception handlers are set in OrdersStreamsConfiguration: its KafkaStreamsConfiguration
# bean replaces Boot's, so spring.kafka.properties / spring.kafka.streams.properties never reach Streams.

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Kafka Streams — orders count and revenue aggregation (all-time, windowed, joined with stores)
    version: 0.0.1-SNAPSHOT

# Logging: see logback-spring.xml

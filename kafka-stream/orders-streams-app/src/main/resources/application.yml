spring:
  application:
    name: orders-kafka-streams
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  kafka:
    # The kafka-core cluster's host listener is SASL_SSL: TLS (truststore holding the dev CA from the
    # kafka-certs compose service) + SCRAM-SHA-512 (user created by kafka-init).
    # Env overrides: KAFKA_USERNAME, KAFKA_PASSWORD, KAFKA_TRUSTSTORE, KAFKA_TRUSTSTORE_PASSWORD.
    security:
      protocol: SASL_SSL
    ssl:
      trust-store-location: file:${KAFKA_TRUSTSTORE:../../kafka-core/certs/kafka.truststore.p12}
      trust-store-password: ${KAFKA_TRUSTSTORE_PASSWORD:kafka-dev-secret}
      trust-store-type: PKCS12
    properties:
      sasl.mechanism: SCRAM-SHA-512
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:orders-streams}" password="${KAFKA_PASSWORD:orders-streams-secret}";
    # OrdersStreamsConfiguration copies these into its own Kafka Streams configuration
    streams:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}   # any broker of the kafka-core cluster
      application-id: orders-kafka-streams
      # state-dir: /var/lib/orders-streams                           # RocksDB state (default: <tmp>/kafka-streams)
# Serdes and exception handlers are set in OrdersStreamsConfiguration: its KafkaStreamsConfiguration
# bean replaces Boot's, so spring.kafka.properties / spring.kafka.streams.properties never reach Streams.

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Kafka Streams — orders count and revenue aggregation (all-time, windowed, joined with stores)
    version: 0.0.1-SNAPSHOT

# Logging: see logback-spring.xml
